site_name: Kilowahti
site_description: Home Assistant integration for European electricity spot pricing and cost optimization
site_url: https://docs.kilowahti.fi/
repo_url: https://github.com/Kilowahti/ha-kilowahti
repo_name: Kilowahti/ha-kilowahti

theme:
  name: material
  logo: assets/dark_icon.png
  favicon: assets/icon.png
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting started:
    - Installation: installation.md
    - First setup: getting-started.md
    - Configuration: configuration.md
  - Reference:
    - Entities: entities.md
    - Services: services.md
    - Supported regions: supported-regions.md
  - Guides:
    - How do I…?: how-do-i.md
    - Triggers and conditions: triggers-conditions.md
    - Automation examples: automations.md
    - Control factor: control-factor.md
    - Optimization scores: scores.md
    - Transfer pricing: transfer-pricing.md
    - Fixed-price periods: fixed-periods.md
  - Help:
    - Troubleshooting: troubleshooting.md
    - Glossary: glossary.md
  - Library:
    - Overview: lib/index.md
    - Models: lib/models.md
    - Calculations: lib/calc.md
    - Price sources: lib/sources.md
    - Constants: lib/const.md
  - FAQ: faq.md
  - Changelog: changelog.md

plugins:
  - search
  - document-dates:
      show_author: false
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fi
          name: Suomi
          build: true
          nav_translations:
            Home: Etusivu
            Getting started: Aloitus
            Installation: Asennus
            First setup: Ensimmäinen käyttöönotto
            Configuration: Asetukset
            Reference: Viitteet
            Entities: Entiteetit
            Services: Palvelut
            Supported regions: Tuetut alueet
            Guides: Oppaat
            How do I…?: Miten teen…?
            Triggers and conditions: Laukaisimet ja ehdot
            Automation examples: Automaatioesimerkit
            Control factor: Ohjauskerroin
            Optimization scores: Optimointipisteet
            Transfer pricing: Siirtohinnat
            Fixed-price periods: Kiinteän hinnan jaksot
            Help: Ohje
            Troubleshooting: Vianmääritys
            Glossary: Sanasto
            Library: Kirjasto
            Overview: Yleiskatsaus
            Models: Mallit
            Calculations: Laskennat
            Price sources: Hintalähteet
            Constants: Vakiot
            FAQ: UKK
            Changelog: Muutosloki

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
